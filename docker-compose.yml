services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  ollama:
    build:
      context: .
      dockerfile: infrastructure/docker/ollama.Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice_ai
    ports:
      - "5432:5432"

  django-core:
    build:
      context: .
      dockerfile: infrastructure/docker/django.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/django-core:/app

  stt-service:
    build:
      context: .
      dockerfile: infrastructure/docker/stt.Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/stt-service:/app

  tts-service:
    image: python:3.11-slim
    command: sleep infinity
    volumes:
      - .:/app

  llm-service:
    build:
      context: .
      dockerfile: infrastructure/docker/llm.Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./services/llm-service:/app
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/app/wait-for-ollama.sh", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]


  action-service:
    image: python:3.11-slim
    command: sleep infinity
    volumes:
      - .:/app

  memory-service:
    image: python:3.11-slim
    command: sleep infinity
    volumes:
      - .:/app

volumes:
  ollama_data: